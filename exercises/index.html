@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&display=swap');
.app{--bg:#182233;--ink:#F3EEE4;--muted:#9AA3B2;--line:#2B3750;--panel:#1C2A3E;
  min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:Heebo,"Segoe UI",Arial,sans-serif;font-size:clamp(16px,1.5vw,24px);line-height:1.5;
  transition:box-shadow .3s}
.app.flash{box-shadow:inset 0 0 0 12px var(--accent);animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{box-shadow:inset 0 0 0 28px var(--accent)}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1{margin:0}
.muted{color:var(--muted)}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;background:var(--panel);padding:0 .3em;border-radius:3px;unicode-bidi:isolate}

/* menu */
.menu{max-width:1100px;margin:0 auto;padding:6vh 4vw}
.kicker{color:var(--muted);font-weight:300;letter-spacing:.02em;text-decoration:none;display:inline-block}
.kicker:hover{color:var(--ink)}
.lnk{color:var(--accent);text-decoration:underline;text-underline-offset:.2em}
.menu h1{font-size:3em;font-weight:800;margin-bottom:.6em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{text-align:start;padding:18px 18px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);
  display:flex;flex-direction:column;gap:4px;transition:border-color .15s}
.tile:hover{border-color:#5A6B8A}
.tnum{font-size:2.2em;font-weight:800;line-height:1}
.ttitle{font-weight:600}
.tmeta{color:var(--muted);font-size:.85em}
.tbar{display:flex;gap:2px;height:4px;margin-top:8px}
.tbar span{display:block;border-radius:2px}
.keys{margin-top:5vh;color:var(--muted);font-size:.85em}

/* stage */
.stage{display:grid;grid-template-rows:auto 1fr;grid-template-columns:1fr 300px;
  grid-template-areas:"head head" "main side";min-height:100vh;padding:24px 3vw 28px;gap:0 3vw;box-sizing:border-box}
.stage.deckmode{grid-template-columns:1fr;grid-template-rows:auto 1fr;grid-template-areas:"head" "main";height:100vh}
header{grid-area:head;display:flex;justify-content:space-between;align-items:center;gap:20px;
  border-bottom:1px solid var(--line);padding-bottom:12px}
.crumb{display:flex;gap:14px;align-items:baseline;padding:0}
.lnum{color:var(--muted)}
.ltitle{font-weight:600}
.progress{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:50%}
.pip{width:14px;height:6px;border-radius:3px;background:var(--line);cursor:pointer;transition:transform .15s}
.pip.on{transform:scaleY(1.6)}
main{grid-area:main;display:flex;align-items:center;padding:3vh 0}
.card{max-width:68ch;width:100%}
.tag{display:inline-block;border:1.5px solid;border-radius:999px;padding:2px 14px;font-weight:600;font-size:.8em;margin-bottom:.9em}
.card h1{font-size:2.1em;font-weight:800;line-height:1.2;display:flex;gap:.45em;align-items:baseline;flex-wrap:wrap}
.qid{color:var(--accent);font-weight:300;font-size:.7em}
.intro h1{font-size:2.6em;margin-bottom:.5em}
.body{margin-top:1em;font-size:1.25em;font-weight:300}
.body strong{font-weight:600}
.body p{margin:.35em 0}
.body p.indent{padding-inline-start:1.6em;color:#D9D2C5}
.gap{height:.6em}
.bullet{display:flex;gap:.7em;align-items:baseline;margin:.25em 0;transition:opacity .25s,filter .25s}
.dot{width:.4em;height:.4em;border-radius:50%;background:var(--accent);flex:none;transform:translateY(-.15em)}
.sub{display:flex;gap:.7em;margin:.5em 0;transition:opacity .25s,filter .25s}
.sub.hidden,.bullet.hidden,tr.hidden{opacity:.18;filter:blur(3px);user-select:none}
.subletter{color:var(--accent);font-weight:600;flex:none;min-width:1.3em}
.figrow{display:flex;gap:12px;flex-wrap:wrap;margin:.8em 0;justify-content:center}
.figrow img{background:#fff;border-radius:6px;padding:10px;max-height:300px;max-width:100%;object-fit:contain;flex:1 1 0;min-width:0}
.figrow img:only-child{max-height:440px;flex:0 1 auto}
.math{unicode-bidi:isolate;white-space:nowrap}
.fig{border:1px dashed #5A6B8A;color:var(--muted);border-radius:6px;padding:.9em 1.2em;margin:.7em 0;font-size:.85em}
.quote{color:var(--muted);font-style:italic}
.more{margin-top:1.2em;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:6px 16px;font-size:.9em}
.more:disabled{opacity:.35;cursor:default}
.body sup,.body sub,.sbody sup,.sbody sub{font-size:.7em;line-height:0}

/* slides */
.card.slide{max-width:1250px}
.slide h1{font-size:2.3em;margin-bottom:.2em}
.sbody{margin-top:.8em;font-size:1.3em;font-weight:300}
.sbody strong{font-weight:600}
.sbody p{margin:.35em 0}
.sbody.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0 4vw;align-items:center}
.sbody .bullet.l1{padding-inline-start:1.6em;font-size:.88em;color:#D9D2C5}
.sbody .bullet.l1 .dot{background:transparent;border:1.5px solid var(--muted)}
.mcol .figrow{margin:.4em 0}
.sbody .figrow img{background:none;padding:0;max-height:56vh}
.sbody .figrow img.card{background:#fff;padding:10px}
.mcol .figrow img{max-height:58vh}
.mcol:has(.figrow + .figrow) .figrow img{max-height:27vh}
.mcol:has(.figrow + .figrow + .figrow) .figrow img{max-height:18vh}
.figrow figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:.3em;flex:1 1 0;min-width:0}
.figrow figure img{max-width:100%}
.figrow figcaption{color:var(--muted);font-size:.7em;text-align:center}
.sbody .figrow img[alt="qr"]{width:min(40vh,340px);max-height:none}
.title-slide .big{font-size:3.4em;margin-top:18vh;text-align:start}
.title-slide p{color:var(--muted);font-size:1.2em}
.big{font-size:2.6em;font-weight:800;line-height:1.15;text-align:center;margin:.4em 0}
.box{background:var(--panel);border-inline-start:4px solid var(--teal,#7FC1C9);border-radius:6px;padding:.6em 1em;margin:.6em 0;font-weight:400}
.code{background:#111A28;border:1px solid var(--line);border-radius:6px;padding:.7em 1em;margin:.6em 0;font-size:.64em;overflow-x:auto}
.crow{display:grid;grid-template-columns:auto;align-items:baseline}
.code.withnotes .crow{grid-template-columns:minmax(0,max-content) 1fr;gap:0 2em}
.code pre{margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.55;text-align:left;white-space:pre}
.cnote{color:var(--muted);font-size:1.15em;font-family:Heebo,Arial,sans-serif}
.cnote.on{color:#F2B441}
.code.withnotes .crow{direction:ltr}
.code.withnotes .cnote{direction:rtl;text-align:right}
.tablewrap{overflow-x:auto;margin:.6em 0}
.sbody table{border-collapse:collapse;font-size:.82em;margin:0 auto}
.sbody th,.sbody td{border:1px solid var(--line);padding:.3em .8em;text-align:center}
.sbody th{background:var(--panel);font-weight:600}
.sbody tr{transition:opacity .25s,filter .25s}
.mermaid-box,.svgbox{display:flex;justify-content:center;margin:.6em 0}
.mermaid-box svg,.svgbox svg{width:100%;height:auto;max-height:62vh}
.sbody:has(.bullet) .svgbox svg{max-height:30vh}
.sbody:has(p,.box,table):not(:has(.bullet)) .svgbox svg{max-height:50vh}
.sbody.split:has(.mermaid-box){grid-template-columns:minmax(0,.55fr) minmax(0,1.45fr)}
.deckmode main{padding:1.5vh 0}
.sbody:not(.split):has(.figrow + .figrow) .figrow img{max-height:30vh}
.notitle .sbody{margin-top:0}
.tex{margin:.5em 0;font-size:1.05em;overflow-x:auto}
.tex .katex-display{margin:0}
.mermaid-box svg{max-width:100%!important;width:auto;height:66vh}
.sbody:has(p,.bullet,.box,table) .mermaid-box svg{height:52vh}
.mcol .mermaid-box svg{height:68vh}
.sbody.dense{font-size:1.02em}
.sbody.dense p{margin:.25em 0}
.code.long{font-size:.52em}
.sbody table.small{font-size:.66em}
.sbody table.small td,.sbody table.small th{padding:.12em .55em}

/* side */
aside{grid-area:side;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.deckmode aside{position:fixed;bottom:10px;left:3vw;font-size:.75em;opacity:.55;transition:opacity .2s}
.deckmode aside:hover{opacity:1}
.ring{position:relative;width:260px;height:260px;border-radius:50%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--line);stroke-width:8}
.ring .arc{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring .time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:3.4em;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;direction:ltr}
.ring .hint{position:absolute;left:0;right:0;bottom:22%;text-align:center;color:var(--muted);font-size:.8em}
.ring.done .time{animation:blink 1s step-end 4}
@keyframes blink{50%{opacity:.25}}
.presets{display:flex;gap:6px}
.presets button{width:44px;height:38px;border:1px solid var(--line);border-radius:4px;font-weight:600}
.presets button.on{border-color:var(--accent);color:var(--accent)}
.presets .reset{border-color:transparent;color:var(--muted)}
.nav{display:flex;gap:14px;align-items:center;color:var(--muted)}
.nav button{border:1px solid var(--line);border-radius:4px;padding:6px 14px}
.nav button:disabled{opacity:.3;cursor:default}

@media (max-width:900px){
  .stage{grid-template-columns:1fr;grid-template-areas:"head" "main" "side"}
  .ring{width:180px;height:180px}
  .ring .time{font-size:2.4em}
  .sbody.split{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.app.flash,.ring.done .time{animation:none}}
